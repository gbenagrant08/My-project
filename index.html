<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gbena Grant — Sky Jump</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 12px;
    overflow: hidden;
    background: #0c0c17;
    color: white;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #game {
    position: relative;
    width: min(360px, calc((100dvh - 24px) * .6), calc(100vw - 24px));
    aspect-ratio: 3 / 5;
    overflow: hidden;
    border: 3px solid #33304c;
    border-radius: 22px;
    background: #1a1b43;
    box-shadow: 0 20px 60px #0009, 0 0 35px #ff3c6e26;
    user-select: none;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #hud {
    position: absolute;
    inset: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 17px 16px;
    pointer-events: none;
    text-shadow: 0 2px 6px #0008;
  }
  #score { font-size: 19px; font-weight: 900; }
  #brand { color: #ffe676; font-size: 16px; font-weight: 900; }
  #controls {
    position: absolute;
    right: 15px;
    bottom: 13px;
    left: 15px;
    display: flex;
    gap: 9px;
    align-items: center;
    justify-content: space-between;
  }
  .control {
    width: 56px;
    height: 52px;
    border: 1px solid #ffffff80;
    border-radius: 16px;
    background: #171734a8;
    color: #fff;
    font-size: 23px;
    font-weight: 900;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    backdrop-filter: blur(5px);
  }
  .control:active, .control.pressed { background: #ff3c6e; transform: translateY(2px); }
  #jump { width: 103px; margin-left: auto; background: #ff3c6e; font-size: 15px; letter-spacing: .08em; }
  #jump:active { background: #ff6b90; }
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #101026bc;
    backdrop-filter: blur(5px);
  }
  .overlay.hidden { display: none; }
  .panel {
    width: 100%;
    padding: 27px 19px;
    border: 1px solid #ffffff38;
    border-radius: 21px;
    background: #1b1a38e8;
    text-align: center;
    box-shadow: 0 15px 40px #0005;
  }
  .icon { font-size: 48px; line-height: 1; }
  h1 { margin: 14px 0 5px; color: #ffe676; font-size: 29px; line-height: 1.1; }
  .subtitle { margin: 0 0 19px; color: #ff799d; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  .instructions { margin: 0 0 20px; color: #e4e2f3; font-size: 14px; line-height: 1.55; }
  .primary {
    width: 100%;
    padding: 13px 18px;
    border: 0;
    border-radius: 13px;
    background: #ff3c6e;
    color: #fff;
    font: inherit;
    font-weight: 900;
    font-size: 17px;
    cursor: pointer;
    box-shadow: 0 5px 0 #ad2047;
  }
  .primary:active { transform: translateY(3px); box-shadow: 0 2px 0 #ad2047; }
  #finalScore { margin: 3px 0 17px; font-size: 20px; font-weight: 800; }
  #bestScore { margin: -8px 0 19px; color: #ffe676; font-size: 14px; }
</style>
</head>
<body>
<div id="game" aria-label="Gbena Grant Sky Jump game">
  <canvas id="canvas" width="360" height="600"></canvas>
  <div id="hud"><span id="score">Score: 0</span><span id="brand">Gbena grant</span></div>

  <div id="controls">
    <button class="control" id="left" aria-label="Move left">◀</button>
    <button class="control" id="right" aria-label="Move right">▶</button>
    <button class="control" id="jump" aria-label="Jump">JUMP</button>
  </div>

  <div class="overlay" id="startScreen">
    <div class="panel">
      <div class="icon">☁️</div>
      <h1>Gbena grant</h1>
      <p class="subtitle">Sky Jump</p>
      <p class="instructions">Dodge falling blocks and grab golden stars!<br><br>
        Move with <b>← →</b> or the buttons.<br>
        Jump with <b>Space</b>, <b>↑</b>, or <b>JUMP</b>.</p>
      <button class="primary" id="startButton">LET'S PLAY</button>
    </div>
  </div>

  <div class="overlay hidden" id="endScreen">
    <div class="panel">
      <div class="icon">💫</div>
      <h1>Game over!</h1>
      <p class="subtitle">Nice jumping</p>
      <div id="finalScore">Score: 0</div>
      <div id="bestScore">Best: 0</div>
      <button class="primary" id="restartButton">TRY AGAIN</button>
    </div>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreLabel = document.getElementById('score');
  const startScreen = document.getElementById('startScreen');
  const endScreen = document.getElementById('endScreen');
  const W = 360, H = 600, ground = 471;
  const keys = { left: false, right: false };
  const player = { x: 164, y: ground - 38, w: 32, h: 38, vy: 0 };
  let state = 'start', obstacles = [], stars = [], particles = [];
  let elapsed = 0, bonus = 0, obstacleTimer = 0, starTimer = 0, lastTime = 0;
  let audio;

  function sound(frequency, duration, type = 'sine', volume = 0.07, endFrequency = frequency) {
    try {
      audio ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, audio.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), audio.currentTime + duration);
      gain.gain.setValueAtTime(volume, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + duration);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start();
      oscillator.stop(audio.currentTime + duration);
    } catch (_) {}
  }

  function score() { return Math.floor(elapsed * 2) + bonus; }

  function reset() {
    player.x = 164;
    player.y = ground - player.h;
    player.vy = 0;
    obstacles = [];
    stars = [];
    particles = [];
    elapsed = 0;
    bonus = 0;
    obstacleTimer = 0;
    starTimer = 0;
    keys.left = keys.right = false;
    document.querySelectorAll('.control').forEach(button => button.classList.remove('pressed'));
    scoreLabel.textContent = 'Score: 0';
    startScreen.classList.add('hidden');
    endScreen.classList.add('hidden');
    state = 'playing';
    lastTime = performance.now();
    sound(520, 0.13, 'sine', 0.07, 780);
  }

  function endGame() {
    state = 'over';
    sound(330, 0.38, 'sawtooth', 0.055, 90);
    burst(player.x + 16, player.y + 18, '#ffffff', 20);
    const total = score();
    let best = total;
    try {
      best = Math.max(total, Number(localStorage.getItem('gbena-sky-jump-best')) || 0);
      localStorage.setItem('gbena-sky-jump-best', best);
    } catch (_) {}
    document.getElementById('finalScore').textContent = `Score: ${total}`;
    document.getElementById('bestScore').textContent = `Best: ${best}`;
    endScreen.classList.remove('hidden');
  }

  function jump() {
    if (state !== 'playing') return;
    if (player.y + player.h >= ground - 2) {
      player.vy = -405;
      sound(350, 0.16, 'triangle', 0.09, 660);
      burst(player.x + 16, ground, '#ffe8ab', 7);
    }
  }

  function burst(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 35 + Math.random() * 145;
      particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
        life: .35 + Math.random() * .35, maxLife: .7, color });
    }
  }

  function overlaps(a, b, pad = 0) {
    return a.x + pad < b.x + b.w && a.x + a.w - pad > b.x &&
           a.y + pad < b.y + b.h && a.y + a.h - pad > b.y;
  }

  function update(dt) {
    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 180 * dt;
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    if (state !== 'playing') return;

    elapsed += dt;
    const difficulty = Math.min(elapsed / 85, 1);
    player.x += ((keys.right ? 1 : 0) - (keys.left ? 1 : 0)) * 255 * dt;
    player.x = Math.max(8, Math.min(W - player.w - 8, player.x));
    player.vy += 980 * dt;
    player.y += player.vy * dt;
    if (player.y + player.h > ground) {
      player.y = ground - player.h;
      player.vy = 0;
    }

    obstacleTimer += dt;
    if (obstacleTimer >= 1.07 - difficulty * .42) {
      obstacleTimer = 0;
      const size = 32 + Math.random() * 24;
      obstacles.push({
        x: 10 + Math.random() * (W - size - 20),
        y: -size, w: size, h: size * .72,
        speed: 185 + difficulty * 100 + Math.random() * 42,
        rotation: Math.random() * .12 - .06
      });
    }
    starTimer += dt;
    if (starTimer >= 1.65) {
      starTimer = 0;
      stars.push({ x: 23 + Math.random() * (W - 46), y: -20, w: 21, h: 21,
        speed: 130 + difficulty * 40, phase: Math.random() * 6 });
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.y += o.speed * dt;
      if (overlaps(player, o, 5)) {
        endGame();
        return;
      }
      if (o.y + o.h >= ground) {
        burst(o.x + o.w / 2, ground, '#ff816f', 8);
        obstacles.splice(i, 1);
        bonus += 8;
        sound(140, 0.055, 'triangle', 0.018, 100);
      }
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      s.y += s.speed * dt;
      s.phase += dt * 5;
      if (overlaps(player, s, -3)) {
        bonus += 25;
        burst(s.x + 10, s.y + 10, '#ffe676', 13);
        stars.splice(i, 1);
        sound(740, 0.22, 'sine', 0.09, 1180);
      } else if (s.y > ground) {
        stars.splice(i, 1);
      }
    }
    scoreLabel.textContent = `Score: ${score()}`;
  }

  function roundedRect(x, y, w, h, radius, fill) {
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, radius);
    ctx.fill();
  }

  function drawStar(cx, cy, radius, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const angle = -Math.PI / 2 + i * Math.PI / 5;
      const r = i % 2 ? radius * .48 : radius;
      const x = cx + Math.cos(angle) * r;
      const y = cy + Math.sin(angle) * r;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }

  function draw(now) {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#171b42');
    sky.addColorStop(.55, '#773e78');
    sky.addColorStop(1, '#ff6880');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    const drift = now * .007;
    ctx.fillStyle = '#ffffff38';
    for (let i = 0; i < 18; i++) {
      const x = (i * 97 + 31) % W;
      const y = (i * 73 + 53 + drift * (i % 3 + 1)) % ground;
      ctx.beginPath();
      ctx.arc(x, y, i % 4 === 0 ? 2 : 1, 0, Math.PI * 2);
      ctx.fill();
    }
    for (let i = 0; i < 5; i++) {
      const x = ((i * 110 - drift * (i % 2 + 1) + W * 10) % (W + 130)) - 65;
      const y = 82 + i * 75;
      ctx.fillStyle = '#ffffff18';
      ctx.beginPath();
      ctx.ellipse(x, y, 55, 13, 0, 0, Math.PI * 2);
      ctx.ellipse(x - 16, y - 9, 24, 17, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 16, y - 6, 28, 17, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#352d55';
    ctx.fillRect(0, ground, W, H - ground);
    ctx.fillStyle = '#ffdf8d';
    ctx.fillRect(0, ground, W, 6);
    ctx.fillStyle = '#49385d';
    for (let x = 0; x < W; x += 34) roundedRect(x + 7, ground + 17, 19, 5, 2, '#49385d');

    for (const s of stars) {
      ctx.save();
      ctx.shadowColor = '#ffe676';
      ctx.shadowBlur = 18;
      drawStar(s.x + 10, s.y + 10, 12 + Math.sin(s.phase) * 1.5, '#ffe676');
      ctx.restore();
    }
    for (const o of obstacles) {
      ctx.save();
      ctx.translate(o.x + o.w / 2, o.y + o.h / 2);
      ctx.rotate(o.rotation);
      ctx.shadowColor = '#160c24';
      ctx.shadowBlur = 12;
      roundedRect(-o.w / 2, -o.h / 2, o.w, o.h, 7, '#252339');
      ctx.shadowBlur = 0;
      roundedRect(-o.w / 2 + 5, -o.h / 2 + 4, o.w - 10, 5, 3, '#67506d');
      ctx.restore();
    }

    if (state !== 'over') {
      const airborne = player.y + player.h < ground - 2;
      ctx.fillStyle = '#17142a55';
      ctx.beginPath();
      ctx.ellipse(player.x + 16, ground + 8, airborne ? 13 : 19, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.shadowColor = '#ffffffaa';
      ctx.shadowBlur = 13;
      roundedRect(player.x, player.y, player.w, player.h, 10, '#ffffff');
      ctx.restore();
      roundedRect(player.x + 5, player.y + 7, 22, 16, 7, '#ff779c');
      ctx.fillStyle = '#241c39';
      ctx.beginPath();
      ctx.arc(player.x + 12, player.y + 15, 2.2, 0, Math.PI * 2);
      ctx.arc(player.x + 21, player.y + 15, 2.2, 0, Math.PI * 2);
      ctx.fill();
      roundedRect(player.x + 13, player.y + 26, 7, 3, 2, '#ff779c');
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life / .3);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const dt = Math.min((now - lastTime) / 1000 || 0, .035);
    lastTime = now;
    update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }

  document.getElementById('startButton').addEventListener('click', reset);
  document.getElementById('restartButton').addEventListener('click', reset);
  document.getElementById('jump').addEventListener('pointerdown', e => {
    e.preventDefault();
    jump();
  });
  for (const direction of ['left', 'right']) {
    const button = document.getElementById(direction);
    button.addEventListener('pointerdown', e => {
      e.preventDefault();
      button.setPointerCapture(e.pointerId);
      keys[direction] = true;
      button.classList.add('pressed');
    });
    const release = () => {
      keys[direction] = false;
      button.classList.remove('pressed');
    };
    button.addEventListener('pointerup', release);
    button.addEventListener('pointercancel', release);
    button.addEventListener('lostpointercapture', release);
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    jump();
  });
  document.addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code) && !e.repeat) {
      if (state !== 'playing') reset();
      else jump();
    }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
  });
  window.addEventListener('blur', () => { keys.left = keys.right = false; });

  lastTime = performance.now();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
